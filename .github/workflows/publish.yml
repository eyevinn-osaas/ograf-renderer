# Docker image to GitHub Container Registry: ghcr.io/<owner>/ograf-renderer
#   push to main  -> :main and :sha-<short>
#   tag vX.Y.Z    -> :X.Y.Z, :X.Y and :latest
# The image is tested (tools/test-in-image.sh) before anything is pushed.

name: Publish image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build for the tests (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ograf-renderer:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tests inside the image
        run: docker run --rm -v "$PWD:/src:ro" --tmpfs /tmp --shm-size=1g ograf-renderer:test sh /src/tools/test-in-image.sh

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ograf-renderer
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=OGraf renderer
            org.opencontainers.image.description=Headless renderer for EBU OGraf graphics: PNG sequences and video, HTTP render service and web editor
            org.opencontainers.image.licenses=Apache-2.0

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64, arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
